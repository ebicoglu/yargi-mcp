[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yargi-cli"
version = "0.1.0"
description = "Command-line client for the Yargı MCP server (Turkish court decisions)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
yargi = "yargi_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["yargi_cli"]
